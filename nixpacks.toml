[phases.setup]
nixPkgs = ["php83", "php83Extensions.gd", "php83Extensions.mbstring", "php83Extensions.pdo_mysql", "php83Extensions.fileinfo", "php83Extensions.zip", "php83Extensions.openssl", "php83Packages.composer", "nodejs_20", "nginx"]

[phases.install]
cmds = ["rm -rf vendor/", "composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist", "npm ci"]
onlyIncludeFiles = ["composer.json", "composer.lock", "package.json", "package-lock.json"]

[phases.build]
cmds = ["composer dump-autoload --optimize --no-dev", "npm run build"]

[phases.release]
cmds = ["echo build-complete"]

[start]
cmd = "bash /app/start-container.sh"

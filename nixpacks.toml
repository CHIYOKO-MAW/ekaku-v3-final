[phases.setup]
nixPkgs = ["php83", "php83Extensions.gd", "php83Extensions.mbstring", "php83Extensions.pdo_mysql", "php83Extensions.fileinfo", "php83Extensions.zip", "php83Extensions.openssl", "php83Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-dev --no-scripts", "npm ci"]

[phases.build]
cmds = ["npm run build"]

[phases.release]
cmds = ["echo build-complete"]

[start]
cmd = "bash /app/start-container.sh"

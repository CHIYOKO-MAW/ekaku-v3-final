worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include $!{nginx}/conf/mime.types;
    index index.html index.htm index.php;

    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;

    client_max_body_size 12M;

    # --- FastCGI Cache ---
    fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2
        keys_zone=EKAKU:10m inactive=10m max_size=50m use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";

    # Bypass cache when session cookie exists (logged-in user)
    map $cookie_laravel_session $skip_session_cache {
        default 0;
        ~.+     1;
    }

    # Bypass cache for non-GET/HEAD methods
    map $request_method $skip_method_cache {
        default 1;
        GET     0;
        HEAD    0;
    }

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name _;

        root /app/public;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            open_file_cache max=3000 inactive=120s;
            open_file_cache_valid 45s;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;
        }

        location ~ \.php$ {
            fastcgi_buffer_size 8k;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_read_timeout 120;
            fastcgi_send_timeout 120;
            fastcgi_connect_timeout 60;

            # --- FastCGI Cache ---
            fastcgi_cache EKAKU;
            fastcgi_cache_valid 200 10m;
            fastcgi_cache_valid 301 302 1m;
            fastcgi_cache_valid 404 1m;

            # Bypass cache for logged-in users and non-GET methods
            fastcgi_cache_bypass $skip_session_cache $skip_method_cache;
            fastcgi_no_cache $skip_session_cache $skip_method_cache;

            # Serve stale content while revalidating
            fastcgi_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            fastcgi_cache_background_update on;
            fastcgi_cache_lock on;
            fastcgi_cache_lock_timeout 3s;

            # Debug header + security headers (add_header in location overrides server-level)
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
